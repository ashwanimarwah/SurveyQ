const brandOrder = () => (S.order.a1 || BRANDS.map(b => b.c));
const awareBrands = a => brandOrder().filter(c => [2, 3, 4].includes(a["a1_" + c]));
const usedPY = a => awareBrands(a).filter(c => a["a3_" + c] === 3);
function bBrands(a) {                         // B loop: Chase first if aware, then random others, up to 3
  const aw = awareBrands(a), key = aw.join(",");
  if (S.bkey !== key) {

function zipState(z) { const p = parseInt(String(z).slice(0, 3), 10); const r = ZIP_RANGES.find(([lo, hi]) => p >= lo && p <= hi); return r ? r[2] : ""; }
function stateRegion(st) { for (const [k, v] of Object.entries(REGION)) if (v.split(" ").includes(st)) return k; return ""; }
function ageBand(n) { if (n == null) return ""; if (n <= 24) return 1; if (n <= 34) return 2; if (n <= 44) return 3; if (n <= 54) return 4; if (n <= 64) return 5; if (n <= 74) return 6; return 7; }

/* ---------------- questionnaire ---------------- */
const SEC = { S: "Screener", A: "Awareness & usage", B: "Brand perceptions", C: "Motivations & challenges", D: "Your views", E: "About your business" };

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
};
const val = (x, a = A) => typeof x === "function" ? x(a) : x;
const visible = q => !q.show || q.show(A);
const qOpts = q => val(q.opts) || [];
const qRows = q => val(q.rows) || [];
const qCols = q => val(q.cols) || [];

function ordered(q, list, key = q.id) {
  if (!S.order[key]) {
    let codes;
    if (q.customOrder) codes = q.customOrder();
    else if (q.randGroups) codes = [...shuf(q.randGroups).flat(), ...list.filter(o => o.anchor).map(o => o.c)];
    else if (q.rand || q.rowRand) codes = [...shuf(list.filter(o => !o.anchor)).map(o => o.c), ...list.filter(o => o.anchor).map(o => o.c)];
    else codes = list.map(o => o.c);
    S.order[key] = codes;
  }
  const known = S.order[key];
  const inList = known.map(c => list.find(o => o.c === c)).filter(Boolean);
  return [...inList, ...list.filter(o => !known.includes(o.c))];
}

function renderOptions(q, err) {
  const multi = q.type === "multi";
  const list = ordered(q, qOpts(q));
  const box = el("div", { class: "options", role: multi ? "group" : "radiogroup", "aria-labelledby": "qtext" });
  const cur = () => multi ? (A[q.id] || []) : A[q.id];
  const exCodes = list.filter(o => o.ex).map(o => o.c);
  const paint = () => {
    const v = cur();
    box.querySelectorAll(".opt").forEach(row => {
      const code = row._code, on = multi ? v.includes(code) : v === code;
      row.classList.toggle("sel", on); row.querySelector("input").checked = on;
      row.classList.toggle("dis", !!(multi && q.max && v.length >= q.max && !on));
      const o = row.querySelector(".other-in"); if (o) o.hidden = !on;
    });
  };
  list.forEach((o, i) => {
    const id = `${q.id}-${i}`;
    const input = el("input", { type: multi ? "checkbox" : "radio", name: q.id, id, value: String(o.c) });
    const label = el("label", { class: `opt ${multi ? "multi" : "single"}`, for: id, "data-code": String(o.c) }, input, el("span", { class: "key" }), el("span", { text: o.l }));

      t.addEventListener("input", () => { S.other[q.id] = t.value; });
      t.addEventListener("click", e => e.stopPropagation());
      label.append(el("span"), t);
    }
    input.addEventListener("change", () => {
      err.textContent = "";
      if (!multi) A[q.id] = o.c;
      else {
        let v = cur().slice();
        if (input.checked) {
          if (exCodes.includes(o.c)) v = [o.c];

        A[q.id] = v;
      }
      paint();
    });
    box.append(label);
  });
  paint();
  return box;
}

  return w;
}
function renderText(q) {
  const w = el("div");
  const ta = el("textarea", { id: `${q.id}-text`, maxlength: "1500", "aria-labelledby": "qtext" });
  ta.value = A[q.id] || "";
  const oos = (q.optOuts || []).map(o => { const cb = el("input", { type: "checkbox", id: `${q.id}-oo${o.c}` }); cb.checked = A[q.id + "_optout"] === o.c; return [o, cb]; });
  ta.addEventListener("input", () => { A[q.id] = ta.value; if (ta.value.trim()) { A[q.id + "_optout"] = null; oos.forEach(([, cb]) => cb.checked = false); } });
  oos.forEach(([o, cb]) => cb.addEventListener("change", () => {
    if (cb.checked) { A[q.id + "_optout"] = o.c; ta.value = ""; A[q.id] = ""; oos.forEach(([o2, c2]) => { if (o2 !== o) c2.checked = false; }); }
    else if (A[q.id + "_optout"] === o.c) A[q.id + "_optout"] = null;
  }));
  w.append(ta, ...oos.map(([o, cb]) => el("label", { class: "dk", for: cb.id }, cb, o.l)));
  return w;
}

function validate(q) {
  switch (q.type) {
    case "info": return "";
    case "single": {
      const v = A[q.id]; if (v == null || !qOpts(q).some(o => o.c === v)) return "Please select an answer.";
      const o = qOpts(q).find(x => x.c === v); if (o && o.other && !(S.other[q.id] || "").trim()) return "Please specify your answer in the text box.";
      return "";
    }
    case "multi": {
      const valid = qOpts(q).map(o => o.c);
      A[q.id] = sel(A, q.id).filter(c => valid.includes(c));
      const v = A[q.id]; if (!v.length) return "Please select at least one answer.";
      if (qOpts(q).some(o => o.other && v.includes(o.c)) && !(S.other[q.id] || "").trim()) return "Please specify your answer in the text box.";
      return "";
    }
    case "grid": { const m = qRows(q).filter(r => A[`${q.id}_${r.c}`] == null || !qCols(q).some(c => c.c === A[`${q.id}_${r.c}`])).length; return m ? `Please answer every row (${m} left).` : ""; }
    case "number": if (A[q.id + "_pna"]) return ""; if (A[q.id] == null || A[q.id] < q.min || A[q.id] > q.max) return `Please enter a whole number between ${q.min} and ${q.max}.`; return "";
    case "zip": if (!/^\d{5}$/.test(A[q.id] || "")) return "Please enter a 5-digit zip code."; return "";
    case "sum": {
      const rows = qRows(q); const vals = rows.map(r => A[`${q.id}_${r.c}`]);
      if (vals.some(v => v == null || v < 1 || v > 100)) return "Please enter a whole number from 1 to 100 for each row.";
      const t = vals.reduce((s, v) => s + v, 0); return t === 100 ? "" : `Your percentages add up to ${t}%. They must total 100%.`;
    }
    case "boxes": {
      if (A[q.id + "_none"]) return "";
      const filled = Array.from({ length: q.n }, (_, i) => (A[`${q.id}_${i + 1}`] || "").trim()).filter(Boolean);
      if (!filled.length) return `Please enter at least one brand, or tick “${q.none}”.`;
      if (filled.some(t => t.length < q.minChars)) return `Each answer must be at least ${q.minChars} characters.`;
      return "";
    }
    case "text": {
      if (A[q.id + "_optout"]) return "";
      const t = (A[q.id] || "").trim();
      if (q.minWords && words(t) < q.minWords) return `Please write at least ${q.minWords} word${q.minWords > 1 ? "s" : ""}.`;
      if (q.minChars && t.length < q.minChars) return "Please write a little more.";
      return "";
    }
  }
  return "";
}

async function advance(err) {
  const q = QUESTIONS[S.idx];
  const msg = validate(q);
  if (msg) { err.textContent = msg; return; }
  const reason = q.term && q.term(A);
  if (reason) { S.termQ = q; finish(reason.startsWith("QUALITY") ? "quality" : "terminated", reason); return; }
  if (q.quotaCheck && server) {
    const btn = $("next-btn"); btn.disabled = true; btn.textContent = "Checking…";
    try {
      const r = await (await fetch(server.api.replace("/responses", "/quota"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cells: quotaCells(A) }) })).json();
      if (r.quotaFull || (r.full && r.full.length)) { finish("overquota", r.quotaFull ? "Quota full" : "Quota cell full: " + r.full.join(", ")); return; }
    } catch (e) { /* if the check fails, carry on; the server re-checks at submission */ }
  }
  go(S.idx + 1, 1);
}

/* ---------------- data record ---------------- */
const labelIn = (list, c) => { const o = (list || []).find(x => x.c === c); return o ? o.l : ""; };
function flagsFor(status, dur) {
  const f = [];
  if (status === "complete" && dur < 300) f.push(`Speeder: ${dur}s`);
  for (const q of QUESTIONS) {
    if (!visible(q)) continue;
    if (q.flag) { const r = q.flag(A); if (r) f.push(r); }
    if (q.straight) { const v = qRows(q).map(r => A[`${q.id}_${r.c}`]).filter(x => x != null); if (v.length >= q.straight && new Set(v).size === 1) f.push(`Straight-lined ${q.id.toUpperCase()}`); }
  }
  for (const id of ["a6", "d1_w3", "s19"]) { const t = (A[id] || "").trim(); if (t && (/(.)\1{4,}/.test(t) || !/[aeiouy]/i.test(t))) f.push(`${id.toUpperCase()} low-quality open end`); }
  return f;
}
function buildRecord(status, reason) {
  const now = new Date(), dur = Math.round((now - (S.startedAt || now)) / 1000);
  const st = zipState(A.s3 || "");
  const r = { status, terminate_reason: reason, flags: "", started_at: (S.startedAt || now).toISOString(), completed_at: now.toISOString(), duration_sec: dur, lang: "en",
    wave: WAVE, h_s5: A.s5 === 1 ? "Agency" : A.s5 === 2 ? "Consumer/Business-facing" : "", h_age_band: ageBand(A.s1), h_generation: generation(A.s1),
    h_state: st, h_region: stateRegion(st), h_industry: hIndustry(A) || "", h_clo_user: A.s16 ? (cloUser(A) ? 1 : 0) : "",
    h_b_brands: (S.bbrands || []).join(";"), quota_cells: quotaCells(A).join(";") };
  for (const q of QUESTIONS) {
    if (q.type === "info") continue;
    const shown = visible(q);
    const uni = q.universe || (typeof q.opts === "function" ? [] : q.opts);
    if (q.type === "single") {
      let v = shown ? A[q.id] : (q.auto ? q.auto(A) : null);
      r[q.id] = v ?? ""; r[q.id + "_label"] = v != null ? (labelIn(shown ? qOpts(q) : uni, v) || labelIn(uni, v)) : "";
    } else if (q.type === "multi") {
      const v = shown ? sel(A, q.id) : [];
      r[q.id] = v.join(";"); r[q.id + "_label"] = v.map(c => labelIn(qOpts(q), c) || labelIn(uni, c)).join("; ");
    } else if (q.type === "grid") {
      const rows = q.universe || q.rows;
      for (const row of (Array.isArray(rows) ? rows : [])) r[`${q.id}_${row.c}`] = shown ? (A[`${q.id}_${row.c}`] ?? "") : "";
    } else if (q.type === "number") { r[q.id] = A[q.id] ?? ""; r[q.id + "_pna"] = A[q.id + "_pna"] ? 1 : ""; }
    else if (q.type === "zip") r[q.id] = A[q.id] || "";
    else if (q.type === "sum") {
      const auto = !shown && q.auto ? q.auto(A) : null;
      for (const row of q.universe) r[`${q.id}_${row.c}`] = shown ? (A[`${q.id}_${row.c}`] ?? 0) : (auto ? (auto[row.c] ?? 0) : "");
    } else if (q.type === "boxes") { for (let i = 1; i <= q.n; i++) r[`${q.id}_${i}`] = shown ? (A[`${q.id}_${i}`] || "").trim() : ""; r[q.id + "_none"] = shown && A[q.id + "_none"] ? 1 : ""; }
    else if (q.type === "text") { r[q.id] = shown ? (A[q.id] || "").trim() : ""; if (q.optOuts) r[q.id + "_optout"] = shown ? (A[q.id + "_optout"] ?? "") : ""; }
    if (["single", "multi"].includes(q.type) && (uni.some(o => o.other) || (typeof q.opts === "function"))) r[q.id + "_other"] = shown ? (S.other[q.id] || "").trim() : "";
  }
  if (S.order.a1) r.h_a1_order = S.order.a1.join(";");
  r.flags = flagsFor(status, dur).join(" | ");
  return r;
}

const MSG = {
  complete: ["Thank you!", "Your responses have been recorded. We appreciate your time and thoughtful feedback."],
  terminated: ["Thank you for your interest", "Unfortunately, based on your answers you don’t qualify for this survey. Thank you for your time."],
  quality: ["Thank you", "Unfortunately we can’t accept this response. Thank you for your time."],
  overquota: ["Thank you for your interest", "We have already received all the responses we need from people like you. Thank you for your time."],
};
function answerText(q) {
  if (q.type === "single") return labelIn(qOpts(q), A[q.id]);
  if (q.type === "multi") return sel(A, q.id).map(c => labelIn(qOpts(q), c)).join("; ");
  if (q.type === "number") return A[q.id + "_pna"] ? q.pna : String(A[q.id] ?? "");
  if (q.type === "text") return (A[q.id] || "").trim();
  return "";
}
async function finish(status, reason) {
  if (S.done) return;
  const btn = $("next-btn"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  const rec = buildRecord(status, reason);
  let res = {};
  if (server) {
    rec.rid = server.rid || "";
    try {
      const r = await fetch(server.api, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rec) });
      if (!r.ok && r.status !== 409) throw new Error(String(r.status));
      res = await r.json().catch(() => ({}));
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = "Try again"; }
      const e2 = $("err"); if (e2) e2.textContent = "Your answers couldn’t be saved. Check your connection and try again.";
      return;
    }
  } else console.log("Preview record (not saved):", rec);
  S.done = true;
  const st = res.status || status;
  const [h, p] = MSG[st] || MSG.terminated;
  const parts = [el("div", { class: "endmark" }), el("h1", { text: h }), el("p", { class: "lead", text: p })];
  if (SHOW_REASON && S.termQ && (st === "terminated" || st === "quality") && S.termQ.req) {
    const q = S.termQ;
    parts.push(el("div", { class: "reason", id: "term-reason" }, el("div", { class: "rk", text: "Why the survey ended" }),
      el("p", {}, el("b", { text: q.id.toUpperCase() + " " }), document.createTextNode(val(q.text))),
      answerText(q) ? el("p", {}, el("span", { class: "rl", text: "Your answer: " }), document.createTextNode(answerText(q))) : null,
      el("p", {}, el("span", { class: "rl", text: "Requirement: " }), document.createTextNode(q.req))));
  }
  $("survey").replaceChildren(...parts);
  if (res.redirect) setTimeout(() => { location.href = res.redirect; }, $("term-reason") ? 8000 : 2000);
}

if (!server) { $("banner").textContent = "Preview: answers are not saved."; $("banner").hidden = false; }
if (server && server.closed) { $("survey").replaceChildren(el("div", { class: "endmark" }), el("h1", { text: MSG.overquota[0] }), el("p", { class: "lead", text: MSG.overquota[1] })); if (server.redirect) setTimeout(() => { location.href = server.redirect; }, 2000); }
else go(0, 1);
window.__S = S;
})();
</script>
